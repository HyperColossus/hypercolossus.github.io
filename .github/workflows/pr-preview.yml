name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Prepare preview site
        shell: bash
        run: |
          rm -rf _preview_site
          mkdir -p _preview_site

          if [ -f package.json ]; then
            npm ci
            npm run build -- --base="/pr-preview/pr-${{ github.event.pull_request.number }}/"
            cp -a dist/. _preview_site/
          else
            rsync -a ./ _preview_site/ \
              --exclude .git \
              --exclude .github \
              --exclude _preview_site \
              --exclude pr-preview
          fi

      - name: Publish preview
        id: preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./_preview_site
          preview-branch: main
          umbrella-dir: pr-preview
          pages-base-url: hypercoloss.us
          action: auto
          comment: true
          qr-code: false
          wait-for-pages-deployment: false
