name: hypercolossus-riftbound-dev
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: riftbound_dev
      POSTGRES_USER: riftbound_owner
      POSTGRES_PASSWORD: ${RIFTBOUND_POSTGRES_PASSWORD:?Run npm run db:up}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riftbound_owner -d riftbound_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
